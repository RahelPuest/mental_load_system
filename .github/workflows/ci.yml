name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Kein Geheimnis: ein Wegwerf-Postgres im Runner, der den Job nicht überlebt. Der Wert
  # steht hier genau einmal, weil er sonst in den URLs und im Rollenskript auseinanderläuft –
  # und das Auseinanderlaufen merkt man erst an 33 roten Suiten mit derselben Meldung.
  DEV_DB_PASSWORD: thealotta_dev_only
  DATABASE_ADMIN_URL: postgres://thealotta:thealotta_dev_only@localhost:5432/thealotta
  TEST_DATABASE_URL: postgres://thealotta_app_user:thealotta_dev_only@localhost:5432/thealotta
  DATABASE_URL: postgres://thealotta_app_user:thealotta_dev_only@localhost:5432/thealotta

jobs:
  static:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  unit:
    name: Domänentests (ohne I/O)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/domain --coverage

  integration:
    name: Datenbank-, API- und Worker-Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thealotta
          POSTGRES_PASSWORD: thealotta_dev_only
          POSTGRES_DB: thealotta
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U thealotta" --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # Die Anwendung darf NICHT als Superuser verbinden – sonst umgeht Postgres die RLS
      # und die Tenant-Isolation wäre nur scheinbar wirksam (ADR-0003).
      - name: Rollen anlegen
        run: |
          psql "$DATABASE_ADMIN_URL" \
            -v app_pw="$DEV_DB_PASSWORD" -v monitor_pw="$DEV_DB_PASSWORD" \
            -v notifier_pw="$DEV_DB_PASSWORD" -v sync_pw="$DEV_DB_PASSWORD" \
            -f ops/scripts/create-roles.sql
      - name: Migrationen anwenden
        run: DATABASE_URL="$DATABASE_ADMIN_URL" pnpm db:migrate

      - run: pnpm vitest run packages/db apps/api apps/worker

  migrations:
    name: Migrationen vorwärts und rückwärts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: thealotta
          POSTGRES_PASSWORD: thealotta_dev_only
          POSTGRES_DB: thealotta
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U thealotta" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Rollen anlegen
        run: |
          psql "$DATABASE_ADMIN_URL" \
            -v app_pw="$DEV_DB_PASSWORD" -v monitor_pw="$DEV_DB_PASSWORD" \
            -v notifier_pw="$DEV_DB_PASSWORD" -v sync_pw="$DEV_DB_PASSWORD" \
            -f ops/scripts/create-roles.sql
      - name: Migrationen anwenden
        run: DATABASE_URL="$DATABASE_ADMIN_URL" pnpm db:migrate
      - name: Seed einspielen
        run: pnpm db:seed
      - name: Erneut anwenden (muss folgenlos sein)
        run: DATABASE_URL="$DATABASE_ADMIN_URL" pnpm db:migrate
      - name: Nachträglich veränderte Migration erkennen
        run: |
          echo "-- absichtliche Änderung" >> packages/db/migrations/0001_extensions_and_roles.sql
          if DATABASE_URL="$DATABASE_ADMIN_URL" pnpm db:migrate; then
            echo "FEHLER: veränderte Migration wurde akzeptiert"; exit 1
          fi
          git checkout packages/db/migrations/0001_extensions_and_roles.sql

  security:
    name: Sicherheitsprüfungen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Abhängigkeiten prüfen
        run: pnpm audit --audit-level high
        continue-on-error: true
      # Nicht gitleaks/gitleaks-action@v2: die prüft bei einem `push` nur die Spanne
      # <vorher>^..<nachher>. Beim ersten Push eines Repositorys hat der Wurzelcommit kein `^`,
      # git bricht mit „unknown revision" ab – und die Action meldete daraufhin
      # „no leaks found in partial scan" nach 0 gelesenen Bytes. Ein Wächter, der nichts liest
      # und trotzdem Entwarnung gibt, ist schlimmer als keiner. Direkt aufgerufen liest gitleaks
      # bei jedem Anlass dieselbe vollständige Historie (deshalb oben fetch-depth: 0).
      - name: Secrets im Verlauf suchen
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose .
      - name: SSRF- und Redaction-Tests
        run: pnpm vitest run apps/worker/test/ssrf.spec.ts packages/domain/test/invariants

  build:
    name: Images bauen
    runs-on: ubuntu-latest
    needs: [static, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API
        uses: docker/build-push-action@v6
        with: { context: ., file: ops/docker/Dockerfile.api, push: false, tags: 'thealotta-api:${{ github.sha }}' }
      - name: Worker
        uses: docker/build-push-action@v6
        with: { context: ., file: ops/docker/Dockerfile.worker, push: false, tags: 'thealotta-worker:${{ github.sha }}' }
      - name: Web
        uses: docker/build-push-action@v6
        with: { context: ., file: ops/docker/Dockerfile.web, push: false, tags: 'thealotta-web:${{ github.sha }}' }
